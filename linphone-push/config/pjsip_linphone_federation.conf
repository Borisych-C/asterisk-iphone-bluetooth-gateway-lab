; Direct inter-domain call; no registration, outbound proxy or account credentials.
[linphone-federation]
type=endpoint
transport=transport-tls-public
from_user=1002
from_domain=home.example.net
contact_user=1002
disallow=all
allow=opus,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=no
use_avpf=no
allow_subscribe=no
allow_transfer=no
