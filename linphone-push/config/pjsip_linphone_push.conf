; Outbound-only route to the public Linphone SIP service.
; Digest credentials are kept separately in pjsip_linphone_push_auth.conf.
; The public Linphone account requires SRTP. Protect its SDES keys with TLS.

[transport-tls-linphone]
type=transport
protocol=tls
bind=192.168.50.10:5061
method=tlsv1_2
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
local_net=192.168.50.0/24

[linphone-push]
type=endpoint
transport=transport-tls-linphone
outbound_proxy=sip:sip.linphone.org:5061\;transport=tls\;lr
outbound_auth=linphone-push-auth
disallow=all
allow=opus
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=no
from_user=traveler-example
from_domain=sip.linphone.org
