name: Offline source and publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install small test and scan tools
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev gitleaks
      - name: Offline tests
        run: python3 scripts/check.py
      - name: Scan committed history
        run: gitleaks detect --source . --config .gitleaks.toml --redact
