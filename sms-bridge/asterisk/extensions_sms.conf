; Only endpoint 1003 uses this message_context, after PJSIP authentication.
[from-travel-sms]
exten => _X.,1,AGI(sms-submit.agi)
 same => n,Hangup()
exten => _+X.,1,AGI(sms-submit.agi)
 same => n,Hangup()
exten => smscheck,1,AGI(sms-submit.agi)
 same => n,Hangup()

; Explicit SMS address avoids the client substituting a phone-book contact.
exten => _sms-X.,1,AGI(sms-submit.agi)
 same => n,Hangup()
