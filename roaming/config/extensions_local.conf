; Minimal local test dialplan. No paid outbound route is enabled yet.

[from-linphone-local]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Partner customer-service IVR, used only to validate chan_mobile/SCO audio.
exten => 611,1,NoOp(Partner IVR test through home SIM)
 same => n,Dial(Mobile/home-iphone/*5474,60)
 same => n,Hangup()

; Manual SIP MESSAGE delivery test. Calling 620 keeps Linphone registered
; while Asterisk sends the captured MAP/iMessage text back to endpoint 1001.
exten => 620,1,Answer()
 same => n,Set(MESSAGE(body)=SMS TEST Привет 123)
 same => n,MessageSend(pjsip:1001,sip:home-iphone@192.168.50.10)
 same => n,NoOp(SIP MESSAGE delivery status: ${MESSAGE_SEND_STATUS})
 same => n,Playback(beep)
 same => n,Hangup()

[from-home-mobile]
exten => s,1,NoOp(Incoming home SIM to personal Linphone)
 ; iPhone may supply an all-spaces name; show the actual caller number.
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/linphone-cellular/sip:traveler-example@sip.linphone.org:5061\;transport=tls,45,b(direct-phone-rtp-source-reset^s^1))
 same => n,Hangup()
