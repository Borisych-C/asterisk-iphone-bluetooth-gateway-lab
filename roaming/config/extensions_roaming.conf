; This context is reachable only through authenticated endpoint 1003.
[from-travel-phone]
exten => 600,1,Gosub(travel-secure,s,1)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
; National, +972 and 00972 forms. Validation happens before Mobile/Dial.
exten => _X.,1,Gosub(travel-dial,s,1(${EXTEN}))
 same => n,Hangup()
exten => _+972.,1,Gosub(travel-dial,s,1(${EXTEN}))
 same => n,Hangup()
exten => _*X.,1,Gosub(travel-dial,s,1(${EXTEN}))
 same => n,Hangup()

[travel-secure]
exten => s,1,GotoIf($["${CHANNEL(pjsip,secure)}" != "1"]?reject)
 same => n,GotoIf($["${CHANNEL(pjsip,local_addr)}" != "192.168.50.10:5062"]?reject)
 same => n,RtpSourceReset()
 same => n,Return()
 same => n(reject),Hangup(21)

[travel-dial]
exten => s,1,Gosub(travel-secure,s,1)
 same => n,Set(IL_NUMBER=${ARG1})
 same => n,GotoIf($["${IL_NUMBER:0:4}" = "+972"]?plus)
 same => n,GotoIf($["${IL_NUMBER:0:5}" = "00972"]?international:national)
 same => n(plus),Set(IL_NUMBER=${IL_NUMBER:4})
 same => n,Goto(prefix)
 same => n(international),Set(IL_NUMBER=${IL_NUMBER:5})
 same => n(prefix),GotoIf($["${IL_NUMBER:0:1}" = "1"]?national)
 same => n,Set(IL_NUMBER=0${IL_NUMBER})
 same => n(national),GotoIf($[${REGEX("^(0[23489][0-9]{7}|0[57][0-9]{8}|1[0-9]{2,3}|1[0-9]{9}|[*][0-9]{3,6})$" ${IL_NUMBER})} = 1]?dial:reject)
 same => n(dial),Dial(Mobile/home-iphone/${IL_NUMBER},60)
 same => n,Return()
 same => n(reject),Hangup(28)
