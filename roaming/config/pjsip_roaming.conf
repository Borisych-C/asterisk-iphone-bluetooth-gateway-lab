; Authenticated outgoing access to the home SIM; no Linphone service credentials.
[1003]
type=endpoint
transport=transport-tls-public
context=from-travel-phone
message_context=from-travel-sms
identify_by=username
auth=travel-phone-auth
aors=1003
disallow=all
allow=alaw,ulaw,opus
media_encryption=sdes
media_encryption_optimistic=no
use_avpf=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow_subscribe=no
allow_transfer=no
callerid=Travel phone <1003>

[1003]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0
maximum_expiration=3600

; Preserve the actual cellular caller number in the From identity.
[linphone-cellular]
type=endpoint
transport=transport-tls-public
from_domain=home.example.net
contact_user=1002
disallow=all
allow=alaw,ulaw,opus
media_encryption=sdes
media_encryption_optimistic=no
use_avpf=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow_subscribe=no
allow_transfer=no
