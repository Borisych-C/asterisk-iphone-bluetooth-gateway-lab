; No includes and no mobile/outgoing routes in this context.
[from-public-sip]
exten => 1002,1,NoOp(Public SIP call to stationary phone)
 same => n,GotoIf($["${CHANNEL(pjsip,secure)}" != "1"]?reject)
 same => n,GotoIf($["${CHANNEL(pjsip,local_addr)}" != "192.168.50.10:5062"]?reject)
 same => n,RtpSourceReset()
 same => n,Dial(PJSIP/1002,45,b(direct-phone-rtp-source-reset^s^1))
 same => n,Hangup()
 same => n(reject),Hangup(21)
