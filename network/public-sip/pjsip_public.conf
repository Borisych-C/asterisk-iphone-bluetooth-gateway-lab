; Public incoming calls to the stationary phone only.
[global]
type=global
endpoint_identifier_order=ip,header,username,anonymous

[transport-tls-public]
type=transport
protocol=tls
bind=192.168.50.10:5062
method=tlsv1_2
cert_file=/etc/asterisk/keys/public-sip/fullchain.pem
priv_key_file=/etc/asterisk/keys/public-sip/privkey.pem
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
verify_client=no
require_client_cert=no
allow_reload=no
; Treat router hairpin traffic as external on this public listener.
local_net=192.168.50.10/32
local_net=10.77.0.0/30
external_signaling_address=home.example.net
external_signaling_port=5061
external_media_address=home.example.net

[public-stationary]
type=endpoint
transport=transport-tls-public
context=from-public-sip
identify_by=header
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=no
use_avpf=yes
allow_subscribe=no
allow_transfer=no

[public-stationary-identify]
type=identify
endpoint=public-stationary
match_header=To: /(^|<)sips?:1002@home-example[.]duckdns[.]org(:[0-9]+)?([>\;]|$)/
