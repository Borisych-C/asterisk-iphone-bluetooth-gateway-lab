; Isolated WebRTC endpoint for the iOS PWA Stage 1 probe.
; The deployment process replaces the password placeholder only on the server.

[transport-wss-stage1]
type=transport
protocol=wss
; WSS itself is accepted by the Asterisk HTTP server on 127.0.0.1:8088.
; PJSIP must bind media-capable transport addressing to all local interfaces;
; binding this object to loopback also binds the WebRTC RTP socket to loopback.
bind=0.0.0.0
allow_reload=yes

[1099]
type=endpoint
transport=transport-wss-stage1
context=from-pwa-stage1
disallow=all
allow=ulaw
allow=alaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
ice_support=yes
media_use_received_transport=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=1099-auth
aors=1099
callerid=PWA Stage 1 <1099>

[1099-auth]
type=auth
auth_type=userpass
username=1099
password=__SET_LOCALLY_NEVER_COMMIT__

[1099]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
