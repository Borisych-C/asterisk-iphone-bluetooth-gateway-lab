# Stage 1 is intentionally nested below the already permitted /flacmusic/
# prefix, avoiding changes to the production TLS virtual host redirect rules.

Alias /flacmusic/phone-probe/ /var/www/asterisk-pwa-stage1/

<Directory /var/www/asterisk-pwa-stage1/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require ip 127.0.0.1 192.168.50.0/24
</Directory>

<Files "stage1-runtime.js">
    Header always set Cache-Control "no-store, max-age=0"
</Files>

<Location /flacmusic/asterisk-ws>
    Require ip 127.0.0.1 192.168.50.0/24
    ProxyPass ws://127.0.0.1:8088/ws retry=0 timeout=60
    ProxyPassReverse ws://127.0.0.1:8088/ws
</Location>

