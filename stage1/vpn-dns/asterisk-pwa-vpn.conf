# Split DNS for the Stage 1 WebRTC PWA.
# Listen only inside AmneziaWG; do not expose a resolver on the LAN or WAN.
interface=awg0
listen-address=10.77.77.1
bind-dynamic
no-dhcp-interface=awg0

# Keep normal name resolution working for the full-tunnel iPhone profile.
no-resolv
server=192.168.50.1
domain-needed
bogus-priv
cache-size=1000

# The public DuckDNS record currently points elsewhere.  Inside the VPN the
# existing certificate name must lead directly to the home Apache server.
# Mark this exact name as local so AAAA and other unmatched query types are not
# forwarded to public DNS and cannot bypass the VPN-only IPv4 answer.
local=/home.example.net/
host-record=home.example.net,192.168.50.10
