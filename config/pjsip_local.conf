; Local-only Linphone test endpoint. The password placeholder is replaced only
; on the server; no SIP credential is stored in this project.

[transport-udp-local]
type=transport
protocol=udp
bind=192.168.50.10:5060
local_net=192.168.50.0/24

[1001]
type=endpoint
transport=transport-udp-local
context=from-linphone-local
disallow=all
allow=ulaw
allow=alaw
auth=1001-auth
aors=1001
acl=lan-only
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid=Local Linphone <1001>

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=__SET_LOCALLY_NEVER_COMMIT__

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

